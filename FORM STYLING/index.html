<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="">
        <div>
     <h1 class="heading">Registration Form - SMIT</h1>
     <h4 class="heading">Services-Education-Registration</h4>
     </div>

     <div class="main">
        <div>
     <label class="label">Select Country</label>
     <input class="input" type="text">
        </div>

        <div>
     <label class="label">Select City</label>
     <input class="input" type="text">
        </div>

        <div>
     <label class="label">Select course or event</label>
     <input type="text" class="input">
        </div>

        <div>
     <label class="label">Select your computer proficiency</label>
     <input type="text" class="input">
        </div>

        <div>
     <label class="label">Full name</label>
     <input type="text" class="input">
        </div>

        <div>
     <label class="label">Father name</label>
     <input type="text" class="input">
     </div>

     <div>
     <label class="label">Email</label>
     <input type="email" class="input">
     </div>

     <div>
     <label class="label">Phone</label>
     <input type="tel" class="input">
     </div>

     <div>
     <label class="label">CNIC</label>
     <input type="number" class="input">
      </div>

      <div>
      <label class="label">Father's CNIC (optional)</label>
     <input type="number" class="input">
     </div>

     <div>
      <label class="label">Date of birth</label>
     <input type="date" class="input">
      </div>

      <div>
      <label class="label">Select gender</label>
     <input type="search" class="input">
     </div>

     <div>
      <label class="label">Address</label>
     <input type="text" class="input">
     </div>
     
     <div>
      <label class="label">Last qualification</label>
     <input type="text" class="input">
     </div>
     
     <div>
      <label class="label">Do you have a laptop?</label>
     <input type="text" class="input">
     </div>

    </div>

     <button type="submit">SUBMIT</button>
    </form>
</body>
</html>
